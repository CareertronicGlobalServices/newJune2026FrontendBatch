<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buttons</title>
  </head>
  <body>
    <h1>Buttons in HTML</h1>
    <!-- Buttons  -->
    <button type="submit">Click me</button>
    <!-- form k anadr submit  -->
    <button type="reset">Reset</button>
    <!-- reset the values in field -->
    <button type="button" onclick="alert(`hello world !`)">Alert</button>
    <br />
    <br />
    <br />
    <br />
    <!-- input  -->
    <label for="firstName">First Name </label><br />
    <input
      type="text"
      id="firstName"
      name="firstName"
      placeholder="Enter your firstName"
      value="Vaibhavi"
      disabled
    />
    <input type="button" value="I am a Button" />
    <br />
    <br />
    <label for="check">TODO</label
    ><input type="checkbox" name="check" id="check" checked />

    <br />
    <br />
    <label for="color">Choose background color</label>
    <input
      type="color"
      name="color"
      id="color"
      style="width: 20px; height: 20px"
    />
    <br />
    <br />
    <label for="date">Select Date</label>
    <input type="date" name="date" id="date" />
    <br />
    <br />
    <label for="date">Select Date</label>
    <input type="email" name="email" id="email" placeholder="your email" />
    <input type="submit" value="submit" onclick="alert(`Form Submitted`)" />
    <input type="file" name="" id="" />
    <br />
    <br />
    <label for="hidden">Hidden Field</label>
    <input type="hidden" name="hidden" id="hidden" />
    <br />
    <br />
    <label for="pass">Password Field</label>
    <input type="password" name="pass" id="pass" />
    <input type="radio" name="" id="" />
    <br />
    <input type="range" />

    <!-- Select -->
    <label>city</label>
    <select>
      <option>Raipur</option>

      <option>kanker</option>

      <option>jdp</option>

      <option>bhilai</option>

      <option>korba</option>
    </select>
  </body>
</html>
