<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- lists in html -->
    <!-- Ordered list  -->

    <p>I need these things for my first day of school</p>
    <ol>
      <li>Pen</li>
      <li>Notebook</li>
      <li>bag</li>
      <li>pouch</li>
    </ol>
    <!-- unordered list -->
    <h2>I am a unordered list</h2>
    <ul>
      <li>Pen</li>
      <li>Notebook</li>
      <li>bag</li>
      <li>pouch</li>
    </ul>

    <!-- dl -->
    <dl>
      <dt>HTML</dt>
      <dd>Hypertext markup language</dd>
    </dl>
    <dl>
      <dt>CSS</dt>
      <dd>Cascading Stylesheet</dd>
    </dl>

    <!-- nested  -->
    <ul>
      <li>
        Hot beverages
        <ul>
          <li>Tea</li>
          <li>Coffee</li>
        </ul>
      </li>
      <li>
        cold beverages
        <ul>
          <li>Tea</li>
          <li>Coffee</li>
        </ul>
      </li>
    </ul>
  </body>
</html>
